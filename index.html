.pnl-link{display:flex;align-items:center;gap:8px;background:none;padding:0;border-radius:4px;font-weight:400;text-align:left;font-size:inherit}.pnl-link.green{color:#009d78}.pnl-link.red{color:#d73752}.pnl-link.muted{color:var(--muted)}.pnl-arrow{color:var(--muted);font-size:22px;line-height:1}.pnl-dialog{border:0;border-radius:20px;width:min(560px,calc(100% - 32px));max-height:90dvh;padding:24px;background:#fff;color:#101828;box-shadow:0 12px 60px #10182833;overflow:auto}.pnl-dialog::backdrop{background:#26385270}.pnl-handle{width:44px;height:5px;border-radius:10px;background:#ccd5e3;margin:0 auto 22px}.pnl-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.pnl-head h2{margin:0;font-size:21px}.pnl-close{background:transparent;color:var(--muted);font-size:24px;padding:4px 10px}.pnl-hero{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0 22px}.pnl-hero .big{margin:0}.pnl-percent{padding:8px 12px;border-radius:10px;font-weight:700;background:#eef2f7;color:var(--muted)}.pnl-percent.green{background:#009d78;color:white}.pnl-percent.red{background:#d73752;color:white}.pnl-detail{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.pnl-detail span{color:var(--muted)}.pnl-detail b{text-align:right}.pnl-explain{margin-top:18px;background:#f0f5fa;border-radius:12px;padding:14px;line-height:1.55;font-size:14px;color:var(--muted)}.pnl-explain summary{cursor:pointer;font-weight:600;color:#101828}.pnl-explain p{margin:10px 0 0}.pnl-explain b{color:#101828}@media(max-width:720px){.pnl-dialog{position:fixed;inset:auto 0 0;margin:0;width:100%;max-width:none;border-radius:22px 22px 0 0;padding:14px 18px max(24px,env(safe-area-inset-bottom));max-height:88dvh}}
.asset-period{display:inline-flex;gap:3px;padding:3px;background:#eef2f8;border-radius:10px}.asset-period button{background:transparent;padding:7px 12px;font-size:13px;white-space:nowrap}.asset-period button.active{background:var(--blue);color:#fff}.metric-help{padding:0 3px;background:transparent;color:#64748b;font-size:16px;line-height:1.2;vertical-align:middle}.metric-hint{margin-top:7px;padding:8px;border-radius:7px;background:#fff;color:#49617e;font-size:12px;line-height:1.4}.metric-hint[hidden]{display:none}.rebalance-table th:last-child,.rebalance-table td:last-child{text-align:left}</style></head><body><header><div><h1>CRYPTO<span style="color:#365eea">PILOT</span></h1><small>Личный портфель · локальная версия</small><div class="right"><button id="rub" onclick="currency('RUB')">₽ RUB</button> <button id="usdt" onclick="currency('USDT')">₮ USDT</button></div></div></header><main><nav id="nav"></nav><section id="view"></section></main><dialog id="pnlDialog" class="pnl-dialog" aria-labelledby="pnlTitle" onclick="if(event.target===this){const r=this.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)this.close()}"></dialog><script>
'use strict';
const coins=['BTC','ETH','SOL','GRAM','ZRO','S','ARB','USDT'],colors=['#f7931a','#6875dd','#18b995','#39a9e9','#26384d','#d16eac','#4477b9','#26a17b'];
const initial={currency:'USDT',targets:{BTC:70,ETH:15,SOL:5,GRAM:5,ZRO:5,S:0,ARB:0,USDT:0},fx:null,fx24:null,quotes:{},history:[],tx:[]};
let s;try{s=JSON.parse(localStorage.getItem('cryptopilot-v1'))||structuredClone(initial)}catch{s=structuredClone(initial)}let realState=s,demoMode=false;let page='overview',selected='BTC',period=0,assetPeriod='day';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x),valid=x=>x!==null&&x!==''&&Number.isFinite(Number(x)),f=(x,n=2)=>valid(x)?Number(x).toLocaleString('ru-RU',{maximumFractionDigits:n,minimumFractionDigits:0}):'—',money=(x,c=s.currency)=>valid(x)?f(x,2)+(c==='RUB'?' ₽':' USDT'):'—',sign=x=>valid(x)?(x>=0?'green':'red'):'muted',pct=x=>valid(x)?(x>0?'+':'')+f(x,2)+'%':'—',plus=(a,b)=>a===null||b===null?null:a+b;
function save(){if(!demoMode)localStorage.setItem('cryptopilot-v1',JSON.stringify(s))}function currency(c){s.currency=c;save();render()}function go(p){page=p;render()}function position(){return {q:0,u:0,r:0,realU:0,realR:0,soldU:0,soldR:0}}function ledger(){let accounts={},issues=[],fundU=0,fundR=0;let get=(e,a)=>((accounts[e]??={})[a]??=position());for(const t of [...s.tx].sort((a,b)=>a.date.localeCompare(b.date))){let w=get(t.exchange,'USDT'),p=get(t.exchange,t.asset),q=+t.qty,a=+t.amount,fee=+t.fee||0;let rate=valid(t.fx)?+t.fx:null;if(t.type==='p2p'){let net=q-(t.feeCoin==='USDT'?fee:0);if(net<=0){issues.push('Некорректный P2P '+t.id);continue}fundU+=net;fundR=plus(fundR,a+(t.feeCoin==='RUB'?fee:0));w.q+=net;w.u+=net;w.r=plus(w.r,a+(t.feeCoin==='RUB'?fee:0));continue}if(t.type==='buy'){let spend=a+(t.feeCoin==='USDT'?fee:0),net=q-(t.feeCoin===t.asset?fee:0);if(net<=0||spend<=0){issues.push('Некорректная покупка '+t.id);continue}let known=Math.min(w.q,spend),basis=known===0?0:w.r===null?null:w.r*known/w.q;let missing=spend-known;if(missing>1e-10){issues.push(t.exchange+': не хватает истории USDT для '+t.asset+' '+t.date.slice(0,10));fundU+=missing;fundR=plus(fundR,rate===null?null:missing*rate);basis=plus(basis,rate===null?null:missing*rate)}if(known){w.r=w.r===null?null:w.r-basisFor(w,known);w.q-=known;w.u=w.q;if(w.q<1e-10){w.q=0;w.u=0;w.r=0}}p.q+=net;p.u+=spend;p.r=plus(p.r,basis)}else if(t.type==='sell'){let out=q+(t.feeCoin===t.asset?fee:0),received=a-(t.feeCoin==='USDT'?fee:0);if(p.q<=0||out>p.q+1e-12||received<0){issues.push('Продажа превышает остаток: '+t.id);continue}let cu=p.u*out/p.q,cr=p.r===null?null:p.r*out/p.q;let rub=rate===null?null:received*rate;p.soldU+=cu;p.soldR=plus(p.soldR,cr);p.realU+=received-cu;p.realR=plus(p.realR,rub===null||cr===null?null:rub-cr);p.q-=out;p.u-=cu;p.r=p.r===null?null:p.r-cr;if(p.q<1e-12){p.q=0;p.u=0;p.r=0}w.q+=received;w.u+=received;w.r=plus(w.r,rub)}}let all={};for(let a of coins){all[a]=position();for(let e of Object.values(accounts)){let p=e[a];if(!p)continue;for(let k of ['q','u','r','realU','realR','soldU','soldR'])all[a][k]=plus(all[a][k],p[k])}}return {all,accounts,issues,fundU,fundR}}function basisFor(w,q){return w.r*q/w.q}
function quote(a){return a==='USDT'?1:valid(s.quotes[a]?.now)?+s.quotes[a].now:null}function valuation(a,p){let q=quote(a),r=s.currency==='RUB',fx=valid(s.fx)?+s.fx:null,fx24=valid(s.fx24)?+s.fx24:null,prev=a==='USDT'?1:valid(s.quotes[a]?.prev)?+s.quotes[a].prev:null;let unit=q===null||r&&fx===null?null:q*(r?fx:1),v=p.q===0?0:unit===null?null:p.q*unit,c=r?p.r:p.u,pl=v===null||c===null?null:v-c,pr=pl===null||!c?null:pl/c*100,old=p.q===0?0:prev===null||r&&fx24===null?null:p.q*prev*(r?fx24:1),day=v===null||old===null?null:v-old;let real=r?p.realR:p.realU,sold=r?(p.soldR===undefined?0:p.soldR):(p.soldU??0),basis=plus(c,sold),allPL=plus(pl,real),allPct=allPL===null||basis===null||basis<=0?null:allPL/basis*100;return {unit,v,c,pl,pr,day,dayPct:day===null||!old?null:day/old*100,avg:p.q&&c!==null?c/p.q:null,real,sold,basis,allPL,allPct}}
function totals(L){let all=L.all;let v=0,c=0,pl=0,real=0,day=0;for(let a of coins){let x=valuation(a,all[a]);v=plus(v,x.v);c=plus(c,x.c);pl=plus(pl,x.pl);real=plus(real,x.real);day=plus(day,x.day)}let funding=s.currency==='RUB'?L.fundR:L.fundU,profit=plus(pl,real),allPct=profit===null||funding===null||funding<=0?null:profit/funding*100;return {v,c,pl,real,day,funding,allPct}}
function metric(l,v,cl=''){const hints={'Нереализованный P&L':'Прибыль или убыток по активам, которые ещё не проданы.','Реализованный P&L':'Прибыль или убыток, зафиксированные после продажи.','Нереализованная прибыль':'Прибыль или убыток по активам, которые ещё не проданы.','Реализованная прибыль':'Прибыль или убыток, зафиксированные после продажи.'};return `<div class="metric"><small>${l}</small>${hints[l]?` <button type="button" class="metric-help" aria-label="Подсказка: ${l}" aria-expanded="false" onclick="const h=this.nextElementSibling;h.hidden=!h.hidden;this.setAttribute('aria-expanded',String(!h.hidden))">ⓘ</button><div class="metric-hint" hidden>${hints[l]}</div>`:''}<div class="value ${cl}">${v}</div></div>`}function card(t,x){return `<div class="card"><h2>${t}</h2>${x}</div>`}function table(h,rows){return `<div class="scroll"><table${h.at(-1)==='Действие'?' class="rebalance-table"':''}><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function coin(a){return `<span class="coin ${a}">${a==='BTC'?'₿':a==='USDT'?'₮':a[0]}</span>${a}`}function field(l,id,type='number',v='',extra=''){return `<div><label for="${id}">${l}</label><input id="${id}" type="${type}" value="${esc(v)}" ${type==='number'?'step="any" min="0"':''} ${extra}></div>`}function opts(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function openPnl(){const T=totals(ledger()),p=plus(T.pl,T.real),d=$('pnlDialog');d.innerHTML=`<div class="pnl-handle"></div><div class="pnl-head"><h2 id="pnlTitle">Прибыль за всё время</h2><button class="pnl-close" aria-label="Закрыть" onclick="$('pnlDialog').close()">×</button></div><div class="pnl-hero"><div class="big ${sign(p)}">${money(p)}</div>${T.allPct===null?'':`<span class="pnl-percent ${sign(p)}">${pct(T.allPct)}</span>`}</div><div class="pnl-detail"><span>Полученная прибыль</span><b class="${sign(T.real)}">${money(T.real)}</b></div><div class="pnl-detail"><span>Нереализованная прибыль</span><b class="${sign(T.pl)}">${money(T.pl)}</b></div><div class="pnl-detail"><span>Базовая стоимость</span><b>${money(T.c)}</b></div><div class="pnl-detail"><span>Внесённый капитал (с учётом недостающих пополнений)</span><b>${money(T.funding)}</b></div><details class="pnl-explain" open><summary>Как происходит расчет?</summary><p><b>Прибыль за всё время</b> = реализованная прибыль + нереализованный PnL;<br><b>Полученная прибыль</b> = (Цена продажи - Средняя цена покупки) * Сумма продажи - Комиссионные за продажу;<br><b>Нереализованная прибыль</b> = (Текущая рыночная цена - Средняя цена покупки) * Удерживаемая сумма;<br><b>Базовая стоимость</b> = Сумма (Цена покупки * Сумма покупки) + Сумма(Комиссионные за покупку)</p><p><a href="#pnl-method" onclick="event.preventDefault();document.getElementById('pnl-method').hidden=!document.getElementById('pnl-method').hidden">Подробнее</a></p><p id="pnl-method" hidden>В CRYPTOPILOT базовая стоимость открытых позиций учитывает оставшиеся активы, комиссии и историю P2P. После продажи себестоимость проданной части исключается. Доходность портфеля = общая прибыль / суммарный внесённый капитал × 100%. Если история USDT отсутствует, недостающие пополнения оцениваются по данным покупок; без курса рублёвая доходность неизвестна. Доходность отдельного актива = (реализованная + нереализованная прибыль) / (себестоимость остатка + себестоимость всех продаж) × 100%. Это простая доходность, не TWR или XIRR.</p></details>`;d.showModal()}
function toggleDemo(){if(demoMode){s=realState;demoMode=false;render();return}realState=s;demoMode=true;s=structuredClone(initial);s.currency=realState.currency;s.fx=85;s.fx24=84;s.targets={BTC:60,ETH:15,SOL:10,GRAM:5,ZRO:5,S:2.5,ARB:2.5,USDT:0};const rows=[['BTC',0.01,60000,65000,64000],['ETH',0.15,2500,2300,2350],['SOL',2,130,150,147],['GRAM',100,1.2,0.85,0.9],['ZRO',30,3,2.7,2.6],['S',200,0.3,0.26,0.25],['ARB',100,0.55,0.62,0.60]];let total=rows.reduce((n,[a,q,p])=>n+q*p,0);let day=n=>new Date(Date.now()-n*86400000).toISOString().slice(0,10);s.tx=[{id:'demo-p2p',type:'p2p',exchange:'HTX',asset:'USDT',date:day(40)+'T09:00:00',qty:total,amount:total*82,fee:0,feeCoin:'USDT',note:'Демонстрационная операция'}];rows.forEach(([a,q,p,now,prev],i)=>{s.tx.push({id:'demo-'+a,type:'buy',exchange:'HTX',asset:a,date:day(30-i)+'T10:00:00',qty:q,amount:q*p,fee:q*0.001,feeCoin:a,note:'Демонстрационная покупка'});s.quotes[a]={now,prev};[30,21,14,7,2,1].forEach((d,j)=>s.history.push({asset:a,date:day(d),price:j===5?prev:p+(prev-p)*j/5+p*[0,.04,-.025,.03,-.015,0][j],fx:82+j*.4}))});render()}
function render(){let L=ledger(),T=totals(L);$('rub').className=s.currency==='RUB'?'active':'';$('usdt').className=s.currency==='USDT'?'active':'';$('nav').innerHTML=[['overview','◉ Обзор'],['asset','◈ Актив'],['tx','↔ Сделки'],['rebalance','◷ Ребаланс'],['settings','⚙ Данные']].map(([p,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('');let x='';if(page==='overview'){x=card('Общая стоимость портфеля',`<div class="big">${money(T.v)}</div><div class="${sign(T.day)}">24 ч.: ${money(T.day)}${T.day===null||T.v===null||!(T.v-T.day)?'':' ('+pct(T.day/(T.v-T.day)*100)+')'}</div><button class="pnl-link ${sign(plus(T.pl,T.real))}" onclick="openPnl()" aria-haspopup="dialog">P&L за всё время: ${money(plus(T.pl,T.real))}${T.allPct===null?'':' ('+pct(T.allPct)+')'}<span aria-hidden="true" class="pnl-arrow">›</span></button><div class="grid" style="margin-top:15px">${metric('Себестоимость открытых позиций',money(T.c))}${metric('Нереализованный P&L',money(T.pl),sign(T.pl))}${metric('Количество активов',coins.filter(a=>L.all[a].q>0).length)}${metric('Реализованный P&L',money(T.real),sign(T.real))}</div><p class="notice">Без введённых котировок и истории P2P неизвестные суммы показываются прочерком, а не нулём.</p>`);x+=card('Активы',`<div class="row" style="justify-content:flex-end;margin-bottom:12px"><div class="asset-period" role="group" aria-label="Период доходности"><button aria-pressed="${assetPeriod==='day'}" class="${assetPeriod==='day'?'active':''}" onclick="assetPeriod='day';render()">24 ч.</button><button aria-pressed="${assetPeriod==='all'}" class="${assetPeriod==='all'?'active':''}" onclick="assetPeriod='all';render()">Всё время</button></div></div>`+table(['Актив','Количество','Цена','Стоимость',assetPeriod==='day'?'24 ч.':'Всё время'],coins.filter(a=>L.all[a].q>0||(assetPeriod==='all'&&(L.all[a].soldU>0||L.all[a].realU!==0||L.all[a].realR!==0))).map(a=>{let p=L.all[a],v=valuation(a,p),profit=assetPeriod==='day'?v.day:plus(v.pl,v.real),percent=assetPeriod==='day'?v.dayPct:v.allPct;return [`<button onclick="selected='${a}';go('asset')">${coin(a)}</button>`,f(p.q,10),money(v.unit),money(v.v),`<span class="${sign(profit)}">${money(profit)}${percent===null?'':'<br>'+pct(percent)}</span>`]})));x+=card('Распределение',distribution(L.all,T.v));}if(page==='asset'){let p=L.all[selected],v=valuation(selected,p);x=card('Актив',`<div class="row"><select style="max-width:180px" onchange="selected=this.value;render()">${opts(coins,selected)}</select><button class="primary" onclick="go('tx')">+ Сделка</button></div><div class="big">${money(v.v)}</div><div class="${sign(v.pl)}">${money(v.pl)} · ${pct(v.pr)}</div><div class="grid" style="margin-top:15px">${metric('Количество',f(p.q,10)+' '+selected)}${metric('Цена сейчас',money(v.unit))}${metric('Средняя покупка с комиссией',money(v.avg))}${metric('Себестоимость',money(v.c))}${metric('24 ч. (цена текущих остатков)',money(v.day)+' · '+pct(v.dayPct),sign(v.day))}${metric('Реализованная прибыль',money(v.real),sign(v.real))}${metric('Нереализованная прибыль',money(v.pl),sign(v.pl))}${metric('Прибыль за всё время',money(v.allPL)+(v.allPct===null?'':' · '+pct(v.allPct)),sign(v.allPL))}${metric('Себестоимость проданной части',money(v.sold))}${metric('Общая себестоимость покупок',money(v.basis))}</div>`);x+=card('График цены и средней покупки',chart(selected,v.avg));x+=card('По биржам',table(['Биржа','Количество','Средняя цена','Стоимость'],Object.entries(L.accounts).filter(([e,o])=>o[selected]).map(([e,o])=>[esc(e),f(o[selected].q,10),money(valuation(selected,o[selected]).avg),money(valuation(selected,o[selected]).v)])));}if(page==='tx'){x=card('Новая транзакция',`<form id="txform" onsubmit="addTx(event)"><div class="grid"><div><label>Операция</label><select id="type" onchange="txLabels()"><option value="buy">Купить актив</option><option value="sell">Продать актив</option><option value="p2p">P2P: купить USDT за RUB</option></select></div><div><label>Биржа</label><select id="exchange">${opts(['HTX','Bybit','Другая'],'HTX')}</select></div><div><label>Актив</label><select id="asset">${opts(coins.filter(a=>a!=='USDT'),selected==='USDT'?'BTC':selected)}</select></div>${field('Дата и время','date','datetime-local',new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),'required')}${field('Количество актива','qty','number','','required min="0.000000000001"')}${field('Сумма сделки без комиссии, USDT','amount','number','','required')}${field('Комиссия','fee','number','0')}<div><label>Валюта комиссии</label><select id="feeCoin">${opts(['ASSET','USDT','RUB'],'ASSET')}</select></div>${field('Курс RUB/USDT (если нет P2P / продажа)','txfx')}${field('ID ордера / сделки','txid','text')}${field('Заметка','note','text')}</div><button class="primary">Добавить транзакцию</button></form>`);x+=card('История операций',table(['Дата / биржа','Тип','Актив','Количество','Цена за единицу','Сумма','Комиссия',''],[...s.tx].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>[esc(t.date.replace('T',' '))+'<br><small>'+esc(t.exchange)+'</small>',{buy:'Покупка',sell:'Продажа',p2p:'P2P'}[t.type],esc(t.asset),f(t.qty,10),money(t.qty?t.amount/t.qty:null,t.type==='p2p'?'RUB':'USDT'),money(t.amount,t.type==='p2p'?'RUB':'USDT'),f(t.fee,10)+' '+esc(t.feeCoin),`<button onclick="removeTx('${encodeURIComponent(t.id).replace(/'/g,'%27')}')">Удалить</button>`])));}if(page==='rebalance'){x=card('Целевые доли портфеля',`<form onsubmit="targets(event)"><div class="grid">${coins.map(a=>field(a+' %','target'+a,'number',s.targets[a]??0,'max="100" required')).join('')}</div><button class="primary">Сохранить доли</button></form>`);x+=card('Ребалансировка',T.v===null||T.v<=0?'<p class="notice">Внесите текущие котировки всех имеющихся активов и валютный курс для расчёта.</p>':table(['Актив','Факт','Цель','Действие'],coins.map(a=>{let v=valuation(a,L.all[a]).v,d=T.v*(s.targets[a]||0)/100-v;return [coin(a),pct(v/T.v*100),f(s.targets[a])+'%',`<span class="${d>=0?'green':'red'}">${Math.abs(d)<.01?'—':(d>0?'Купить ':'Продать ')+money(Math.abs(d))}</span>`]}))+`<p class="notice">Расчёт без будущих комиссий; операции не исполняются автоматически.</p>`);x+=card('Распределение',distribution(L.all,T.v));}if(page==='settings'){x=card('Котировки и курсы',`<form onsubmit="quotes(event)"><div class="grid">${field('Текущий RUB за USDT','fx','number',s.fx??'')}${field('RUB за USDT 24 часа назад','fx24','number',s.fx24??'')}${coins.filter(a=>a!=='USDT').map(a=>field(a+' сейчас, USDT','now'+a,'number',s.quotes[a]?.now??'')+field(a+' 24 ч. назад, USDT','prev'+a,'number',s.quotes[a]?.prev??'')).join('')}</div><button class="primary">Сохранить котировки</button></form><p class="notice">Ручные котировки; автоматическое обновление ещё не подключено.</p>`);x+=card('История для графика',`<form onsubmit="point(event)"><div class="grid"><div><label>Актив</label><select id="pa">${opts(coins.filter(a=>a!=='USDT'),selected)}</select></div>${field('Дата','pd','date',new Date().toISOString().slice(0,10),'required')}${field('Цена, USDT','pp','number','','required')}${field('Курс RUB/USDT на дату','pf')}</div><button class="primary">Добавить точку</button></form>`);x+=card('Биржи и аккаунт',`<p><b>HTX</b> · не подключена</p><p><b>Bybit</b> · ручной учёт</p><p><b>Telegram / подписка</b> · сервер не подключён</p><p class="notice">Не вводите API-ключи в локальную версию. Для синхронизации и авторизации требуется защищённый сервер.</p>`);x+=card('Резервная копия',`<div class="row"><button onclick="download()">Экспорт JSON</button><label><input type="file" accept="application/json" onchange="restore(event)"></label><button onclick="if(confirm('Удалить все операции и настройки?')){s=structuredClone(initial);s.tx=[];save();render()}">Очистить данные</button></div>`)}x='<div class="row" style="margin-bottom:12px">'+(demoMode?'<strong style="color:#a36713">ДЕМО · условные данные</strong>':'<small>Тестирование портфеля</small>')+'<button onclick="toggleDemo()">'+(demoMode?'Выйти из демо':'Загрузить демо')+'</button></div>'+x;if(L.issues.length)x+=card('Требуется сверка',L.issues.map(i=>`<p class="warn">${esc(i)}</p>`).join(''));$('view').innerHTML=x;if(page==='tx')txLabels()}
function distribution(all,total){if(total===null||total<=0)return '<p class="muted">Доля будет рассчитана после ввода котировок.</p>';let stop=0,parts=[],legend='';coins.forEach((a,i)=>{let v=valuation(a,all[a]).v/total*100;if(v<=0)return;parts.push(`${colors[i]} ${stop}% ${stop+v}%`);stop+=v;legend+=`<div><span style="color:${colors[i]}">● ${a}</span><b>${f(v)}%</b></div><div class="bar"><i style="width:${v}%;background:${colors[i]}"></i></div>`});return `<div class="row"><div class="donut" style="background:conic-gradient(${parts.join(',')})"><span>${coins.filter(a=>all[a].q>0).length} активов</span></div><div class="legend">${legend}</div></div>`}
function chart(a,avg){let data=s.history.filter(t=>t.asset===a&&(s.currency==='USDT'||valid(t.fx))).sort((a,b)=>a.date.localeCompare(b.date));let now=Date.now();if(period)data=data.filter(t=>Date.parse(t.date)>=now-period*86400000);let vals=data.map(t=>t.price*(s.currency==='RUB'?t.fx:1));let current=valuation(a,{q:1,u:0,r:0,realU:0,realR:0}).unit;if(current!==null){data.push({date:new Date().toISOString().slice(0,10)});vals.push(current)}let buttons=[1,7,30,90,0].map(n=>`<button class="${period===n?'active':''}" onclick="period=${n};render()">${n===0?'Все':n===1?'24 ч.':n+' д.'}</button>`).join(' ');let nums=vals.concat(avg===null?[]:[avg]);if(!nums.length)return buttons+'<p class="muted">Нет данных графика. Добавьте котировки в разделе «Данные».</p>';let lo=Math.min(...nums),hi=Math.max(...nums);let pad=(hi-lo||hi||1)*.1;lo-=pad;hi+=pad;let y=v=>20+(hi-v)/(hi-lo)*180;let px=i=>12+i*350/Math.max(1,vals.length-1);let path=vals.map((v,i)=>`${i?'L':'M'}${px(i)} ${y(v)}`).join(' ');return buttons+`<svg viewBox="0 0 470 240" role="img" aria-label="График цены и средней покупки">${[0,1,2,3,4].map(i=>{let v=hi-i*(hi-lo)/4;return `<line x1="12" x2="362" y1="${y(v)}" y2="${y(v)}" stroke="#e4ebf4"/><text x="367" y="${y(v)+4}" font-size="10" fill="#68788b">${f(v,0)}</text>`}).join('')}<path d="${path}" fill="none" stroke="#365eea" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${y(v)}" r="3" fill="#365eea"/>`).join('')}${avg===null?'':`<line x1="12" x2="362" y1="${y(avg)}" y2="${y(avg)}" stroke="#e29a23" stroke-width="2" stroke-dasharray="7 4"/><text x="15" y="${Math.max(11,y(avg)-6)}" font-size="11" fill="#a96910">Средняя: ${f(avg)}</text>`}<text x="12" y="229" font-size="10" fill="#68788b">${esc(data[0]?.date??'')}</text><text x="362" y="229" text-anchor="end" font-size="10" fill="#68788b">${esc(data.at(-1)?.date??'')}</text></svg><small>Синяя — введённые цены; оранжевая — текущая средняя себестоимость. Не является автоматическим рыночным графиком.</small>`}
function txLabels(){let p=$('type').value==='p2p';$('asset').disabled=p;document.querySelector('label[for=qty]').textContent=p?'Получено USDT до комиссии':'Количество актива';document.querySelector('label[for=amount]').textContent=p?'Заплачено RUB без комиссии':'Сумма сделки без комиссии, USDT';if(p)$('feeCoin').value='USDT'}function addTx(e){e.preventDefault();let type=$('type').value,asset=type==='p2p'?'USDT':$('asset').value,feeCoin=$('feeCoin').value==='ASSET'?asset:$('feeCoin').value,qty=+$('qty').value,amount=+$('amount').value,fee=+$('fee').value||0,id=$('txid').value.trim()||crypto.randomUUID(),exchange=$('exchange').value;if(s.tx.some(t=>t.id===id)){alert('Такой ID уже есть');return}if(qty<=0||amount<=0||fee<0||type!=='p2p'&&feeCoin==='RUB'&&fee>0||type==='p2p'&&feeCoin==='USDT'&&fee>=qty||type==='buy'&&feeCoin===asset&&fee>=qty||type==='sell'&&feeCoin==='USDT'&&fee>amount){alert('Проверьте сумму, количество и комиссию');return}let t={id,type,exchange,asset,qty,amount,fee,feeCoin,date:$('date').value,fx:$('txfx').value?+$('txfx').value:null,note:$('note').value};if(type==='sell'&&qty+(feeCoin===asset?fee:0)>(ledger().accounts[exchange]?.[asset]?.q||0)+1e-12){alert('Недостаточно актива');return}s.tx.push(t);save();render()}function removeTx(id){if(confirm('Удалить операцию?')){s.tx=s.tx.filter(t=>t.id!==decodeURIComponent(id));save();render()}}function targets(e){e.preventDefault();let t=Object.fromEntries(coins.map(a=>[a,+$('target'+a).value]));if(Math.abs(Object.values(t).reduce((a,b)=>a+b,0)-100)>1e-6){alert('Сумма долей должна быть 100%');return}s.targets=t;save();render()}function readN(id){return $(id).value===''?null:+$(id).value}function quotes(e){e.preventDefault();s.fx=readN('fx');s.fx24=readN('fx24');for(let a of coins.filter(a=>a!=='USDT'))s.quotes[a]={now:readN('now'+a),prev:readN('prev'+a)};save();render()}function point(e){e.preventDefault();let t={asset:$('pa').value,date:$('pd').value,price:readN('pp'),fx:readN('pf')};s.history=s.history.filter(x=>!(x.asset===t.asset&&x.date===t.date));s.history.push(t);save();render()}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='cryptopilot-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.tx)||!v.targets||!v.quotes||!Array.isArray(v.history)||!['RUB','USDT'].includes(v.currency))throw Error();if(!confirm('Заменить локальные данные?'))return;s=v;save();render()}catch{alert('Неверный файл резервной копии')}}render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
